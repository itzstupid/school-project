`;
document.head.appendChild(bookStyle);

/* ==========================================
   SAVE DATA
========================================== */

let bookPoints = Number(localStorage.getItem("ltBookPoints")) || 0;
let unlockedBookLevels = JSON.parse(
  localStorage.getItem("ltUnlockedLevels") || '["Beginner"]'
);
let completedBookIds = JSON.parse(
  localStorage.getItem("ltCompletedBooks") || "[]"
);

const bookLevelNames = [
  "Beginner", "Intermediate", "Professional", "Expert"
];

const bookLevelCosts = {
  Beginner:0,
  Intermediate:30,
  Professional:30,
  Expert:30
};

function saveBookProgress() {
  localStorage.setItem("ltBookPoints",bookPoints);
  localStorage.setItem("ltUnlockedLevels",JSON.stringify(unlockedBookLevels));
  localStorage.setItem("ltCompletedBooks",JSON.stringify(completedBookIds));
}

/* ==========================================
   CREATE SIDEBAR
========================================== */

const bookButton = document.createElement("button");
bookButton.id = "bookLaunch";
bookButton.textContent = "📚 Book Library";
document.querySelector("header").appendChild(bookButton);

const bookOverlay = document.createElement("div");
bookOverlay.id = "bookOverlay";
document.body.appendChild(bookOverlay);

const bookSidebar = document.createElement("aside");
bookSidebar.id = "bookSidebar";
bookSidebar.innerHTML = `
  <button id="bookClose" style="float:right;">✕</button>
  <h2>📚 Reading Library</h2>
  <p style="color:#aaaabd;line-height:1.6;">
    Read stories, explore new ideas and earn points.
  </p>
  <div id="bookPoints">⭐ 0 Points</div>
  <div id="bookLevels"></div>
  <p style="color:#888;font-size:12px;line-height:1.6;margin-top:20px;">
    Complete a book and read its summary to earn 10 points.
  </p>
`;
document.body.appendChild(bookSidebar);

const bookReader = document.createElement("div");
bookReader.id = "bookReader";
bookReader.innerHTML = `
  <button id="bookCloseReader" style="background:#30304a;color:white;float:right;">✕ Close</button>
  <p id="bookReaderLevel" style="color:#a855f7;font-weight:bold;"></p>
  <h2 id="bookReaderTitle"></h2>
  <div id="bookStory"></div>
  <h3>📖 Story Summary</h3>
  <div id="bookSummary"></div>
  <div style="margin-top:25px;background:#11111c;padding:18px;border-radius:9px;">
    <label style="color:#ddd;display:flex;align-items:center;gap:10px;">
      <input type="checkbox" id="bookReadCheck">
      I have finished reading the story and its summary.
    </label>
    <button id="bookClaim" disabled>⭐ Complete Book & Earn 10 Points</button>
    <p id="bookNotice"></p>
  </div>
`;
document.body.appendChild(bookReader);

function openBookSidebar() {
  bookSidebar.classList.add("open");
  bookOverlay.classList.add("open");
  renderBookLevels();
}
function closeBookSidebar() {
  bookSidebar.classList.remove("open");
  bookOverlay.classList.remove("open");
}
bookButton.addEventListener("click",openBookSidebar);
bookOverlay.addEventListener("click",closeBookSidebar);
document.getElementById("bookClose").addEventListener("click",closeBookSidebar);
document.getElementById("bookCloseReader").addEventListener("click",()=>{
  bookReader.classList.remove("open");
});

/* ==========================================
   LEVELS AND BOOK LIST
========================================== */

function renderBookLevels() {
  document.getElementById("bookPoints").textContent =
    "⭐ " + bookPoints + " Points";

  const container = document.getElementById("bookLevels");
  container.innerHTML = "";

  bookLevelNames.forEach((level,index)=>{
    const unlocked = unlockedBookLevels.includes(level);
    const books = readingBooks.filter(book=>book.level===level);
    const completedCount = books.filter(book=>
      completedBookIds.includes(book.title)
    ).length;

    const section = document.createElement("div");
    section.className = "book-level";

    const heading = document.createElement("div");
    heading.className = "book-level-heading";
    heading.textContent =
      ["🌱 ","📘 ","🚀 ","🏆 "][index] + level;

    const status = document.createElement("span");
    status.style.fontSize = "12px";
    status.textContent = unlocked
      ? completedCount + "/5 completed"
      : "🔒 Locked";
    heading.appendChild(status);
    section.appendChild(heading);

    const list = document.createElement("div");
    list.className = "book-list";

    if(unlocked) {
      books.forEach(book=>{
        const done = completedBookIds.includes(book.title);
        const button = document.createElement("button");
        button.className = "book-entry";
        button.innerHTML = `
          <span>${done ? "✅ " : "📕 "}${book.title}</span>
          <span class="book-small">${done ? "Read" : "+10 pts"}</span>
        `;
        button.addEventListener("click",()=>openReadingBook(book));
        list.appendChild(button);
      });
    } else {
      const cost = bookLevelCosts[level];
      const unlockButton = document.createElement("button");
      unlockButton.className = "book-entry";
      unlockButton.innerHTML =
        <span>🔒 Unlock ${level}</span><span>⭐ ${cost} points</span>;
      unlockButton.disabled = bookPoints < cost;

      unlockButton.addEventListener("click",()=>{
        if(bookPoints < cost) return;
        if(!confirm("Unlock " + level + " for " + cost + " points?")) return;

        bookPoints -= cost;
        unlockedBookLevels.push(level);
        saveBookProgress();
        renderBookLevels();
      });
      list.appendChild(unlockButton);

      const message = document.createElement("p");
      message.style.cssText = "color:#999;font-size:12px;padding:8px;";
      message.textContent = "Complete books in the previous level to earn points.";
      list.appendChild(message);
    }

    section.appendChild(list);
    container.appendChild(section);
  });
}

/* ==========================================
   OPEN AND COMPLETE A BOOK
========================================== */

let currentReadingBook = null;

function openReadingBook(book) {
  currentReadingBook = book;

  document.getElementById("bookReaderLevel").textContent =
    book.level.toUpperCase() + " LEVEL";

  document.getElementById("bookReaderTitle").textContent = book.title;

  const storyContainer = document.getElementById("bookStory");
  storyContainer.innerHTML = "";

  book.story.forEach(paragraph=>{
    const p = document.createElement("p");
    p.textContent = paragraph;
    storyContainer.appendChild(p);
  });

  document.getElementById("bookSummary").textContent = book.summary;

  const check = document.getElementById("bookReadCheck");
  const claim = document.getElementById("bookClaim");
  const notice = document.getElementById("bookNotice");

  check.checked = false;
  check.disabled = completedBookIds.includes(book.title);
  claim.disabled = true;

  if(completedBookIds.includes(book.title)) {
    claim.textContent = "✅ Book Already Completed";
    notice.textContent = "You have already earned points for this book.";
  } else {
    claim.textContent = "⭐ Complete Book & Earn 10 Points";
    notice.textContent = "Read the complete story and summary to claim your points.";
  }

  bookReader.classList.add("open");
}

document.getElementById("bookReadCheck").addEventListener("change",event=>{
  document.getElementById("bookClaim").disabled = !event.target.checked;
});

document.getElementById("bookClaim").addEventListener("click",()=>{
  if(!currentReadingBook) return;
  if(!document.getElementById("bookReadCheck").checked) return;
  if(completedBookIds.includes(currentReadingBook.title)) return;

  completedBookIds.push(currentReadingBook.title);
  bookPoints += 10;

  saveBookProgress();

  document.getElementById("bookReadCheck").disabled = true;
  document.getElementById("bookClaim").disabled = true;
  document.getElementById("bookClaim").textContent = "✅ Completed!";
  document.getElementById("bookNotice").textContent =
    "Excellent work! You earned 10 points. Your new total is " +
    bookPoints + " points.";

  renderBookLevels();
});

renderBookLevels();
</script>
